# Case → Progress Signature mapping (v2.2 taxonomy)
# Generated: Phase B classification of 67 vulhub oracle cases
#
# Schema:
#   <case_id>:
#     outcome:                rce | read
#     primary:                <mechanism> M01-M12
#     secondary:              <carrier> | null
#     reason:                 <one-line justification>
#     evidence_in_oracle:     <key code fragment from oracle_solution.sh>
#     allow_carrier_fallback: false (default; opt-in only)
#
# Mechanisms (v2.3):
#   M01 sql-injection      M07 deserialization
#   M02 nosql-injection    M08 upload-then-access
#   M03 path-traversal     M09 auth-bypass-chain
#   M04 xxe                M10 config-abuse
#   M05 engine-injection   M11 non-http-protocol
#   M06 cmd-injection      M12 misc-lite
#
# v2.3 Notes:
#   - M02 nosql-injection: DEFERRED (no current cases; definition retained for future).
#   - M05 engine-injection: cases tagged with `subtype:` field for monitoring.
#     Subtypes: template | expression | direct-eval | dispatch-hijack | embedded-script
#
# Optional fields:
#   subtype:                <only for M05; one of {template, expression, direct-eval, dispatch-hijack, embedded-script}>

